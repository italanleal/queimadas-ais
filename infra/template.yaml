AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: INPE - produtor local, SQS FIFO, Lambda H3, DynamoDB, Function URL publica e mapa D3 estatico
Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:8000
    Description: Origem do website para CORS (sem barra final)
  H3Resolution:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 15
  ReserveConsumerConcurrency:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      'true' reserva concorrencia = 1 no consumidor. Use 'false' apenas em contas com
      quota de concorrencia Lambda baixa (ex. 10); a fila FIFO com um unico
      MessageGroupId continua entregando uma mensagem por vez.
Conditions:
  ReserveConcurrency: !Equals [!Ref ReserveConsumerConcurrency, 'true']
Resources:
  DatasetBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  InputQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-consumer'
      RetentionInDays: 14
  Consumer:
    Type: AWS::Serverless::Function
    DependsOn: ConsumerLogGroup
    Metadata:
      Dockerfile: consumer/Dockerfile
      DockerContext: ..
      DockerTag: inpe-consumer
    Properties:
      FunctionName: !Sub '${AWS::StackName}-consumer'
      PackageType: Image
      Architectures: [x86_64]
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: !If [ReserveConcurrency, 1, !Ref AWS::NoValue]
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          H3_RESOLUTION: !Ref H3Resolution
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSPollerPolicy:
            QueueName: !GetAtt InputQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt DataTable.Arn
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt InputQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
  Backend:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: backend/Dockerfile
      DockerContext: ..
      DockerTag: inpe-backend
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      Timeout: 29
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          H3_RESOLUTION: !Ref H3Resolution
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt DataTable.Arn
  BackendUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Backend.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowMethods: [GET]
        AllowHeaders: [Accept]
        MaxAge: 300
  BackendUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref Backend
      Principal: '*'
      FunctionUrlAuthType: NONE
  BackendInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Backend
      Principal: '*'
      InvokedViaFunctionUrl: true
  ProducerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissoes do produtor local; anexar a uma identidade IAM dedicada
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion, s3:AbortMultipartUpload]
            Resource: !Sub '${DatasetBucket.Arn}/consolidated/*'
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt InputQueue.Arn
Outputs:
  BucketName:
    Value: !Ref DatasetBucket
  QueueUrl:
    Value: !Ref InputQueue
  TableName:
    Value: !Ref DataTable
  ProducerPolicyArn:
    Value: !Ref ProducerPolicy
  ConsumerFunction:
    Value: !Ref Consumer
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  ApiUrl:
    Value: !GetAtt BackendUrl.FunctionUrl
